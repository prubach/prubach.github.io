<section id="publications" class="section-block">
  <h2 class="section-title">Publications</h2>

  <div id="pub-tabs"></div>
  <div id="pub-list"></div>
  <span class="pub-keywords">Structural biology · Bioinformatics · Distributed computing</span>
  <h3>Download a list of my publications in the <a href="{{ '/assets/data/pawelrubach.bib' | relative_url }}">BIB format here</a></h3>
</section>

<script>
  const publications_all = {{ site.data.publications | jsonify }};
  const citations_all = {{ site.data.publications_citations | jsonify }};

  var publications = null;
  if (publications_all == null) {
    publications = [];
    publicationsGeneratedAt = null;
  } else {
    publications =  publications_all.publications;
    publicationsGeneratedAt = publications_all.generated_at;
  }

  var citations = null;
  var citationsGeneratedAt = null;
  if (citations_all == null) {
    citations = [];
    citationsGeneratedAt = null;
  } else {
    citations = citations_all.publications;
    citationsGeneratedAt = citations_all.generated_at;
  }

  const abstracts = {{ site.data.publications_figures | jsonify }};
  const categoryData = {{ site.data.publications_categories | jsonify }};

  const pubList = document.getElementById("pub-list");
  const pubTabs = document.getElementById("pub-tabs");

  const categories = ["All", ...categoryData.categories];
  //const categories = [...categories_all];
  const highlyCitedSet = computeHighlyCited(publications);

  if (highlyCitedSet.size > 0) {
    categories.splice(1, 0, "Highly cited");
    // puts it right after "All"
  }
  const assignments = categoryData.assignments;

  /* ---------- BUILD TABS ---------- */
  function renderTabs() {
    pubTabs.innerHTML = categories
      .map((cat, i) =>
      `<div class="pub-tab ${i === 0 ? 'active' : ''}" data-category="${cat}">
        ${cat === "Highly cited" ? "⭐ Highly cited" : cat}
      </div>`
      )
      .join("");

    // Add click handlers
    document.querySelectorAll(".pub-tab").forEach(tab => {
      tab.addEventListener("click", e => {
        document.querySelectorAll(".pub-tab").forEach(t => t.classList.remove("active"));
        e.target.classList.add("active");
        const category = e.target.dataset.category;
        renderPublications(category);
      });
    });
  }

  // Citations

  // Highly cited
  function getCitationScore(pubId) {
    const pc = citations?.find(p => p.id === pubId);
    if (!pc || !pc.citation_counts) return 0;

    const c = pc.citation_counts;
    return Math.max(
      c.scopus || 0,
      c.semanticscholar || 0,
      c.openalex || 0,
      c.crossref || 0,
      c.webofscience || 0
    );
  }

  function computeHighlyCited(publications, percentile = 0.3) {
    const scores = publications.map(p => ({
      id: p.id,
      score: getCitationScore(p.id)
    })).filter(x => x.score > 0);

    if (scores.length === 0) return new Set();

    scores.sort((a, b) => b.score - a.score);

    const cutoffIndex = Math.floor(scores.length * percentile);
    const cutoffScore = scores[cutoffIndex]?.score ?? Infinity;

    return new Set(
      scores.filter(s => s.score >= cutoffScore).map(s => s.id)
    );
  }

  // / highly cited

  function citationLink(source, p) {
    switch (source) {
      case "scopus":
        return p.doi
          ? `https://www.scopus.com/results/results.uri?doi=${encodeURIComponent(p.doi)}`
          : null;

      case "semanticscholar":
        return p.title
          ? `https://www.semanticscholar.org/search?q=${encodeURIComponent(p.title)}`
          : null;

      case "openalex":
        return p.alex_id
          ? `https://openalex.org/works/${p.alex_id}`
          : null;

      case "crossref":
        return p.doi
          ? `https://search.crossref.org/search/works?q=${encodeURIComponent(p.doi)}`
          : null;

      case "webofscience":
        return p.wos_id
          ? `https://www.webofscience.com/wos/woscc/full-record/${encodeURIComponent(p.wos_id)}`
          : null;

      default:
        return null;
    }
  }

  function renderCitationBadges(p, citationCounts) {
    if (!citationCounts) return "";

    const sources = [
      { key: "openalex", label: "OpenAlex", logo: "/assets/images/citations/openalex.png" },
      { key: "crossref", label: "Crossref", logo: "/assets/images/citations/crossref.svg" },
      { key: "scopus", label: "Scopus", logo: "/assets/images/citations/scopus.png" },
      { key: "webofscience", label: "Web of Science", logo: "/assets/images/citations/wos.svg" },
      { key: "semanticscholar", label: "Semantic Scholar", logo: "/assets/images/citations/semanticscholar.png" }
    ];

    const total = sources.reduce(
      (sum, s) => sum + (citationCounts[s.key] || 0),
      0
    );
    if (total === 0) return "";

    let html = `<div class="pub-citations">`;

    sources.forEach(s => {
    const count = citationCounts[s.key] ?? 0;
    const link = citationLink(s.key, p);

    html += `
      <a class="citation-badge citation-${s.key} ${count === 0 ? "citation-zero" : ""}"
         ${link ? `href="${link}" target="_blank"` : ""}
         aria-label="${s.label} citations: ${count}"
         title="${s.label}">
        <img src="${s.logo}" alt="" class="citation-logo" loading="lazy">
        <span class="citation-count">${count}</span>
      </a>
    `;
    });
    html += `</div>`;
    return html;
  }

  function renderCitationsUpdated() {
    if (!publicationsGeneratedAt) return "";
    if (!citationsGeneratedAt) return "";

    const citdate = new Date(citationsGeneratedAt);
    const citformatted = citdate.toLocaleDateString(undefined, {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
    const pubdate = new Date(publicationsGeneratedAt);
    const pubformatted = pubdate.toLocaleDateString(undefined, {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    return `
      <div class="pub-updated">
        Publication list updated: <time datetime="${publicationsGeneratedAt}">${pubformatted}.
        Citation data last updated: <time datetime="${citationsGeneratedAt}">${citformatted}
        </time>
      </div>
    `;
  }


  /* ---------- RENDER PUBLICATION LIST ---------- */
  function renderPublications(category = "All") {
    let html = '<ul class="pub-container">';

    let pubsToRender = publications;

    if (category === "Highly cited") {
      pubsToRender = publications
        .filter(p => highlyCitedSet.has(p.id))
        .sort((a, b) => getCitationScore(b.id) - getCitationScore(a.id));
    }

    pubsToRender.forEach(p => {
      const pubCats = assignments[p.id] || ["Uncategorized"];

      // Filtering: publication passes if ANY category matches
      if ((category !== "All" && category !=="Highly cited") && !pubCats.includes(category)) {
        return;
      }

      const formattedAuthors = p.authors.join(', ');
      const ga = abstracts.find(a => a.id === p.id);

      // Citations
      var pc = citations.find(({ id }) => id === p.id)
      if (pc == null) {
        pc = { citation_counts: {}, citations: {} };
      }
      const c = pc.citation_counts || {};
      const cites = pc.citations || {};

      // Expandable lists for citing papers
      let citationDetails = "";
      ["openalex"].forEach(src => {
        if (cites[src] && cites[src].length > 0) {
          citationDetails += `
          <details class="citing-${src}">
            <summary aria-label="List of papers citing this publication in ${src}">
              Citing papers (${src} – ${cites[src].length})
            </summary>
            <ul>
              ${cites[src].map(cp => `
                <li>
                  ${cp.doi
                    ? `<a href="${cp.doi}" target="_blank">${cp.title}</a>`
                    : cp.title}
                  (${cp.year || "n.d."}) ${cp.doi
                    ? `${cp.doi}` : ""}
                </li>`).join("")}
            </ul>
          </details>
          `;
        }
      });
      // / Citations

      // <div class="pub-citations">${citationBadges}</div>

      html += `
        <li class="pub-item">
          <span class="pub-title">${p.title}</span><br>
          <span class="pub-authors">${formattedAuthors}</span><br>
          ${p.journal ? `<span class="pub-journal">${p.journal}</span>` : ""}
          ${p.year ? `<span class="pub-year">${p.year}</span>` : ""}
          ${p.doi ? `<a class="pub-doi" href="https://doi.org/${p.doi}" target="_blank" aria-label="Publication with DOI: ${p.doi}">DOI: ${p.doi}</a>` : ""}
          <br>
          ${renderCitationBadges(pc, c)}
          <span class="pub-cat-label">Categories: ${pubCats.join(", ")}</span>
          ${citationDetails}
          ${ga ? `
            <div class="pub-abstract-figure">
              <a href="${ga.url}" target="_blank">
                <img src="/assets/images/graph/${ga.file}" alt="Graphical abstract for ${p.title}">
              </a>
            </div>
          ` : ""}
        </li>
      `;
    });

    html += "</ul>";
    html += renderCitationsUpdated();
    pubList.innerHTML = html;
  }

  // Initialize
  renderTabs();
  renderPublications();
</script>

<style>
  .pub-cat-label {
    display: inline-block;
    margin-top: 4px;
    font-size: 0.8em;
    color: #777;
  }
  .pub-tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .pub-tab {
    padding: 6px 14px;
    border-radius: 6px;
    background: #f0f2f6;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s;
  }

  .pub-tab.active {
    background: #7c9cc5;
    color: white;
  }

  .pub-tab:hover {
    background: #d6dce6;
  }

  /* old style */

  #publications .pub-container {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  /* Subtle modern bullet marker */
  .pub-item {
    opacity: 0.95;
    padding: 12px 0 12px 20px;
    position: relative;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }

  .pub-item::before {
    content: "•";
    color: #7c9cc5;     /* Soft muted blue */
    font-size: 20px;
    position: absolute;
    left: 0;
    top: 10px;
  }

  .pub-title {
    font-weight: 700;
    font-size: 1.05em;
    color: #111;
  }

  .pub-authors {
    font-size: 0.92em;
    color: #666;
  }

  .pub-journal {
    font-style: italic;
    font-weight: 700;
    font-size: 0.92em;
    color: #555;
  }

  .pub-year {
    font-size: 0.9em;
    font-weight: 600;
    color: #333;
  }

  .pub-doi {
    font-size: 0.85em;
    color: #5a6b85;
    text-decoration: none;
  }

  .pub-doi:hover {
    text-decoration: underline;
  }

  .pub-abstract-figure {
    margin-top: 10px;
    text-align: left;
  }

  .pub-abstract-figure img {
    max-width: 400px;
    border-radius: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    transition: transform 0.2s ease;
  }

  .pub-abstract-figure img:hover {
    transform: scale(1.03);
  }

  /* Tabs container */
  #pub-tabs {
    display: flex;
    gap: 12px;
    border-bottom: 2px solid #ddd;
    margin-bottom: 20px;
    padding-bottom: 6px;
  }

  /* Individual tab */
  .pub-tab {
    padding: 8px 14px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.95em;
    color: #555;
    border-radius: 6px 6px 0 0;
    transition: all 0.2s ease;
  }

  /* Hover effect */
  .pub-tab:hover {
    background: #f3f6fa;
    color: #333;
  }

  /* Active tab */
  .pub-tab.active {
    color: #000;
    border-bottom: 3px solid #4979d8; /* Soft blue underline */
    background: #f8f9fb;
  }

  .pub-citations {
    display: flex;
    gap: 10px;
    margin: 6px 0 4px;
    flex-wrap: wrap;
  }

  .citation-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.78rem;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid #e5e7eb;
    color: #1f2937;
    background: #f8fafc;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .citation-badge:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .citation-logo {
    width: 14px;
    height: 14px;
  }

  /* Gray out zero counts */
  .citation-zero {
    opacity: 0.35;
    pointer-events: none;
    filter: grayscale(1);
  }

  /* Subtle source accents */
  .citation-scopus { background: #fff3e6; }
  .citation-semanticscholar { background: #eef6ff; }
  .citation-openalex { background: #ecfeff; }
  .citation-crossref { background: #f0fdf4; }
  .citation-webofscience { background: #f5f3ff; }

  .pub-updated {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: #6b7280;
    text-align: right;
  }

  .pub-updated time {
    font-weight: 500;
  }
</style>
